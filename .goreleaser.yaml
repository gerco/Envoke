version: 2

project_name: envoke

before:
  hooks:
    - go mod tidy

builds:
  - id: envoke
    builder: prebuilt
    binary: envoke
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    prebuilt:
      path: binaries/{{ .Os }}_{{ .Arch }}/{{ .Binary }}{{ if eq .Os "windows" }}.exe{{ end }}

archives:
  - formats: [tar.gz]
    name_template: "envoke_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

brews:
  - name: envoke
    repository:
      owner: gerco
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://git.dries.info/gerco/Envoke"
    description: "Environment secrets manager with pluggable backends"
    license: "MIT"
    install: |
      bin.install "envoke"
      bin.install_symlink "envoke" => "ee"
    test: |
      assert_match version.to_s, shell_output("#{bin}/envoke version")
      assert_match version.to_s, shell_output("#{bin}/ee version")

release:
  github:
    owner: gerco
    name: envoke
