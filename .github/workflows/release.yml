name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-darwin:
    if: github.server_url == 'https://github.com'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build darwin binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p binaries/darwin_arm64 binaries/darwin_amd64

          # arm64 — native build, CGO works out of the box
          CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 \
            go build -tags aws \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o binaries/darwin_arm64/envoke ./cmd/ee

          # amd64 — cross-compile; Apple clang supports -arch x86_64 on arm64 hosts
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 \
            CC="$(xcrun -find clang) -arch x86_64" \
            go build -tags aws \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o binaries/darwin_amd64/envoke ./cmd/ee

      - name: Upload darwin binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-darwin
          path: binaries/
          if-no-files-found: error

  build-linux-windows:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build linux and windows binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p binaries/linux_amd64 binaries/linux_arm64 \
                   binaries/windows_amd64 binaries/windows_arm64

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -tags aws \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o binaries/linux_amd64/envoke ./cmd/ee

          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -tags aws \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o binaries/linux_arm64/envoke ./cmd/ee

          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build -tags aws \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o binaries/windows_amd64/envoke.exe ./cmd/ee

          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 \
            go build -tags aws \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o binaries/windows_arm64/envoke.exe ./cmd/ee

      - name: Upload linux/windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-windows
          path: binaries/
          if-no-files-found: error

  release:
    needs: [build-darwin, build-linux-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries/
          merge-multiple: true

      - name: Release with GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
